name: Replication

# Runs the full analysis pipeline from a clean checkout and then checks every
# reproduced number against the value printed in the article. This is the gate
# the EUP replication editor's report asks for: if it is green, the package
# reproduces the paper.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::MASS
            any::nnet
            any::brant
            any::marginaleffects
            any::ggplot2
            any::scales

      - name: Run the pipeline
        run: Rscript code/00_run_all.R

      - name: Validate every reported number
        run: Rscript validation/validate.R

      # Only the CSVs are compared. PNGs and RDS files carry rendering and
      # serialisation details that differ between machines even when the
      # numbers behind them are identical.
      - name: Confirm no tabular output drifted
        run: |
          if ! git diff --quiet -- 'output/*.csv'; then
            echo "Regenerated tables differ from the committed ones:"
            git diff --stat -- 'output/*.csv'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figures
          path: output/*.png
